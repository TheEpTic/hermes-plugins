[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-ssh"
version = "0.3.0"
description = "SSH remote execution plugin for Hermes Agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography >= 48.0.1, < 49"]
authors = [
    { name = "TheEpTic", email = "nexus@eptic.me" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

keywords = ["ssh", "remote", "hermes", "agent", "devops"]

[project.urls]
Homepage = "https://github.com/TheEpTic/hermes-plugins"
Repository = "https://github.com/TheEpTic/hermes-plugins"
Issues = "https://github.com/TheEpTic/hermes-plugins/issues"
Changelog = "https://github.com/TheEpTic/hermes-plugins/blob/main/hermes-ssh/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "mypy==1.16.0",
    "pytest==9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_tools"]

[project.entry-points."hermes_agent.plugins"]
hermes-ssh = "ssh_tools"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
pythonpath = ["src"]

filterwarnings = [
    "ignore::DeprecationWarning:paramiko.*",
    "ignore::DeprecationWarning:asyncssh.*",
    "ignore::DeprecationWarning:_distutils_hack.*",
    "default::DeprecationWarning",
]
