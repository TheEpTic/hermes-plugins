name: publish hermes-jev-compact to pypi

"on":
  push:
    tags:
      - "hermes-jev-compact-v*"

permissions:
  contents: read

jobs:
  prepare:
    name: validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: validate package version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#hermes-jev-compact-v}"
          test -n "$version"
          package_version=$(python -c "import tomllib; print(tomllib.load(open('hermes-jev-compact/pyproject.toml', 'rb'))['project']['version'])")
          test "$version" = "$package_version" || {
            echo "tag version $version does not match hermes-jev-compact version $package_version" >&2
            exit 1
          }

  build:
    name: build hermes-jev-compact
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-jev-compact
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: build distributions
        run: uv build --out-dir dist
      - name: verify distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: hermes-jev-compact-dist
          path: hermes-jev-compact/dist/
          if-no-files-found: error

  publish:
    name: publish hermes-jev-compact
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: hermes-jev-compact-dist
          path: dist
      - name: publish package distributions to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
