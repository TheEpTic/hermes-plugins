[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-sfw"
version = "0.1.0"
description = "Socket Firewall Free wrapper for Hermes — block malicious dependencies during install"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TheEpTic", email = "nexus@eptic.me" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

keywords = ["hermes", "agent", "plugin", "sfw", "socket", "security", "dependencies"]

[project.urls]
Homepage = "https://github.com/TheEpTic/hermes-plugins"
Repository = "https://github.com/TheEpTic/hermes-plugins"
Issues = "https://github.com/TheEpTic/hermes-plugins/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.15.15",
    "mypy==1.16.0",
    "pytest==9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_sfw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "ARG001", # unused kwargs (handler signatures need **kwargs by contract)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
